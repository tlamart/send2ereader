services:
  send2ereader:
    image: ${SEND2EREADER_IMAGE:-ghcr.io/tlamart/send2ereader:latest}
    container_name: send2ereader
    # Restart means, Automatic re-start the container after a shutdown unless manual stop container
    restart: unless-stopped
    # Ports means, Bind external and internal docker ports, only change the external port, not the internal port
    # Format: <External Port>:<Internal Port>
    ports:
      - 3001:3001
    environment:
      - SECRET_UPLOAD_ROUTE=${SECRET_UPLOAD_ROUTE:-}
      - SECRET_RECEIVE_ROUTE=${SECRET_RECEIVE_ROUTE:-}
      - SECRET_UPLOAD_USERNAME=${SECRET_UPLOAD_USERNAME:-}
      - SECRET_UPLOAD_PASSWORD=${SECRET_UPLOAD_PASSWORD:-}
      - SECRET_EXPIRE_DELAY=${SECRET_EXPIRE_DELAY:-}
      - SECRET_MAX_EXPIRE_DURATION=${SECRET_MAX_EXPIRE_DURATION:-}
      - MAX_STORED_BYTES=${MAX_STORED_BYTES:-}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-}
      - GENERATE_RATE_LIMIT=${GENERATE_RATE_LIMIT:-}
      - UPLOAD_RATE_LIMIT=${UPLOAD_RATE_LIMIT:-}
      - CONVERSION_TIMEOUT=${CONVERSION_TIMEOUT:-}
      - MAX_URLS_PER_KEY=${MAX_URLS_PER_KEY:-}
      - SECRET_AUTH_RATE_LIMIT=${SECRET_AUTH_RATE_LIMIT:-}
